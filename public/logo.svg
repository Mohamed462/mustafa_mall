<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- Brand Icon -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield / Shopping Bag / Arch Geometry -->
    <rect x="2" y="10" width="56" height="50" rx="14" fill="#0b2545" stroke="#f59e0b" stroke-width="2.5" />
    <!-- Architectural Dome / Handle Arc -->
    <path d="M16 16 C16 4, 44 4, 44 16" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Stylized Arabic Letter M / Archway -->
    <path d="M15 48 V30 Q22 20 30 32 Q38 20 45 30 V48" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Sparkling Gold Star of Excellence -->
    <polygon points="30,16 32,21 37,21 33,24 35,29 30,26 25,29 27,24 23,21 28,21" fill="#f59e0b" />
  </g>

  <!-- Typography -->
  <!-- Arabic Primary Name -->
  <text x="80" y="44" font-family="'Cairo', 'Noto Sans Arabic', sans-serif" font-weight="900" font-size="28" fill="#0b2545" letter-spacing="-0.5">
    مـول المصـطفى
  </text>
  <!-- English Subtitle & Tagline -->
  <text x="82" y="62" font-family="'Cairo', sans-serif" font-weight="700" font-size="11" fill="#d97706" letter-spacing="1.5">
    AL MOSTAFA MALL • SHOPPING &amp; PRINT
  </text>
</svg>
